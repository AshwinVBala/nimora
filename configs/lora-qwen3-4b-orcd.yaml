dataloader_num_workers: 4
device: cuda
resume_from_checkpoint: null
assistant_mask_scope: last

quantization:
  enabled: true
  quant_type: nf4
  double_quantization: true

adapter:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
