model_name: Qwen/Qwen3-4B
train_files:
  - data/trajectories/train.jsonl
validation_files:
  - data/trajectories/validation.jsonl
output_dir: runs/nimora-code-4b-lora
sequence_length: 2048
precision: fp16
micro_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 0.0001
weight_decay: 0.01
warmup_ratio: 0.03
epochs: 2.0
logging_steps: 5
evaluation_steps: 100
save_steps: 100
save_total_limit: 3
seed: 1337
gradient_checkpointing: true
dataloader_num_workers: 2
device: auto
resume_from_checkpoint: null

adapter:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
