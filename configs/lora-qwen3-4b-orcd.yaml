validation_files:
  - data/trajectories/alpha-v0.0.1/validation.jsonl
output_dir: runs/nimora-agent-orcd
sequence_length: 2048
precision: fp16
micro_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 0.0001
weight_decay: 0.01
warmup_ratio: 0.03
epochs: 1.0
